<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mosaico UMNG</title>
  <!-- Asegúrate que el nombre del CSS coincide exactamente -->
  <link rel="stylesheet" href="mosaicocss.css">
</head>
<body>
  <div class="mosaico">
    <!-- TÍTULO dentro del recuadro azul -->
    <div class="titulo">
      <h1>UNIVERSIDAD MILITAR NUEVA GRANADA</h1>
    </div>

    <!-- CONTENEDOR DE ROMBOS (6,5,4,3,4) -->
    <div class="contenedor-rombos">
      <!-- Fila 1: 6 rombos -->
      <div class="fila fila1">
        <div class="rombo"></div>
        <div class="rombo"></div>
        <div class="rombo"></div>
        <div class="rombo"></div>
        <div class="rombo"></div>
        <div class="rombo"></div>
      </div>

      <!-- Fila 2: 5 rombos -->
      <div class="fila fila2">
        <div class="rombo"></div>
        <div class="rombo"></div>
        <div class="rombo"></div>
        <div class="rombo"></div>
        <div class="rombo"></div>
      </div>

      <!-- Fila 3: 4 rombos -->
      <div class="fila fila3">
        <div class="rombo"></div>
        <div class="rombo"></div>
        <div class="rombo"></div>
        <div class="rombo"></div>
      </div>

      <!-- Fila 4: 3 rombos -->
      <div class="fila fila4">
        <div class="rombo"></div>
        <div class="rombo"></div>
        <div class="rombo"></div>
      </div>

      <!-- Fila 5: 4 rombos -->
      <div class="fila fila5">
        <div class="rombo"></div>
        <div class="rombo"></div>
        <div class="rombo"></div>
        <div class="rombo"></div>
      </div>
    </div>

    <!-- ESCUDO (imagen) : reemplaza "escudo.png" por la ruta de tu archivo -->
    <div class="escudo">
      <!-- Descomenta y cambia la ruta cuando tengas la imagen -->
      <img src="Bandera_UMNG.jpg" alt="Escudo Universidad Militar Nueva Granada">
    </div>
  </div>
</body>
</html>
