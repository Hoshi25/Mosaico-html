 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mosaico UMNG</title>
  <link rel="stylesheet" href="mosaicocss.css">
  <script src="videos.js"></script>
</head>

<body>

  <!-- Modal para mostrar los videos -->
  <div id="videoModal" class="modal">
    <div class="modal-content">
      <span class="cerrar">&times;</span>
      <video id="videoPlayer" width="100%" controls autoplay></video>
      <button id="btnCerrarVideo">Cerrar video</button>
    </div>
  </div>

  <div class="mosaico">
    <div class="titulo">
      <h1>UNIVERSIDAD MILITAR NUEVA GRANADA</h1>
    </div>
    <!-- ⭐ SUBTÍTULO UBICADO A LA DERECHA ⭐ -->

    <div class="subtitulo-horizontal-abajo">
      <br>Invitados a conocer<br>Los Futuros ingenieros<br>De la UMNG
    </div>

    <div class="contenedor-rombos">
      

      <!-- Fila 1 -->
      <div class="fila fila1">
        <div class="rombo" id="rombo1"><img src="Imagenes/Angie.jpeg"></div>
        <div class="rombo" id="rombo2"><img src="Imagenes/dali.jpg"></div>
        <div class="rombo" id="rombo3"><img src="Imagenes/dana.jpg"></div>
        <div class="rombo" id="rombo4"><img src="Imagenes/daniela.jpeg"></div>
        <div class="rombo" id="rombo5"><img src="Imagenes/dustin.jpeg"></div>
      </div>

      <!-- Fila 2 -->
      <div class="fila fila2">
        <div class="rombo" id="rombo6"><img src="Imagenes/edward.jpg"></div>
        <div class="rombo" id="rombo7"><img src="Imagenes/emy.jpeg"></div>
        <div class="rombo" id="rombo8"><img src="Imagenes/Felipe Salamanca.jpeg"></div>
        <div class="rombo" id="rombo9"><img src="Imagenes/isabella.jpeg"></div>
        <div class="rombo" id="rombo10"><img src="Imagenes/juan moreno.jpg"></div>
      </div>

      <!-- Fila 3 -->
      <div class="fila fila3">
        <div class="rombo" id="rombo11"><img src="Imagenes/juandavid.jpeg"></div>
        <div class="rombo" id="rombo12"><img src="Imagenes/karen silva.jpg"></div>
        <div class="rombo" id="rombo13"><img src="Imagenes/maria paula.jpg"></div>
        <div class="rombo" id="rombo14"><img src="Imagenes/maria.jpeg"></div>
        <div class="rombo" id="rombo15"><img src="Imagenes/nicolas.jpg"></div>
      </div>

      <!-- Fila 4 -->
      <div class="fila fila4">
        <div class="rombo" id="rombo16"><img src="Imagenes/Nicolxd.jpeg"></div>
        <div class="rombo" id="rombo17"><img src="Imagenes/Samuel.jpeg"></div>
        <div class="rombo" id="rombo18"><img src="Imagenes/santiago bolaños.jpeg"></div>
        <div class="rombo" id="rombo19"><img src="Imagenes/Simon.jpeg"></div>
        <div class="rombo" id="rombo20"><img src="Imagenes/sofia.jpeg"></div>
      </div>

    </div>

    <!-- Escudo -->
    <div class="escudo">
      <img src="Imagenes/Escudo.jpg" alt="Escudo Universidad Militar Nueva Granada">
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
