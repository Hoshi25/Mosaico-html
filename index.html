<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mosaico UMNG</title>
  <link rel="stylesheet" href="mosaicocss.css">
  <script src="videos.js"></script>

</head>
<body>
  <!-- Modal para mostrar los videos -->
  <div id="videoModal" class="modal">
    <div class="modal-content">
      <span class="cerrar">&times;</span>
      <video id="videoPlayer" width="100%" controls autoplay></video>
    </div>
  </div>

  <div class="mosaico">
    <div class="titulo">
      <h1>UNIVERSIDAD MILITAR NUEVA GRANADA</h1>
    </div>

    <div class="contenedor-rombos">
      <!-- Fila 1 -->
      <div class="fila fila1">
        <div class="rombo"><img src="Nicolás.jpeg" alt="Imagen 3"></div>
        <div class="rombo"></div>

        <!-- Rombo Daniela -->
        <div class="rombo" id="rombo3"><img src="Daniela.jpeg" alt="Imagen 3"></div>

        <!-- Rombo Santiago -->
        <div class="rombo" id="rombo4"><img src="Santiago.jpeg" alt="Imagen 3"></div>

        <div class="rombo"><img src="juandavid.jpeg" alt="Imagen 3"></div>

        <div class="rombo"><img src="juandavid.jpeg" alt="Imagen 3"></div>
      </div>

      <!-- Fila 2 -->
      <div class="fila fila2">
        <div class="rombo"><img src="isabella.jpeg" alt="Imagen 3"></div>
        <div class="rombo"><img src="Ed.jpeg" alt="Imagen 3"></div>
        <div class="rombo"><img src="Dali.jpeg" alt="Imagen 3"></div>
        <div class="rombo"><img src="Mariap.jpeg" alt="Imagen 3"></div>
        <div class="rombo"><img src="Emily.jpeg" alt="Imagen 11"></div>
      </div>

      <!-- Fila 3 -->
      <div class="fila fila3">
        <div class="rombo"><img src="Moreno.jpeg" alt="Imagen 3"></div>
        <div class="rombo"><img src="Maria.png" alt="Imagen 3"></div>
        <div class="rombo"><img src="Dustin.jpeg" alt="Imagen 3"></div>
        <div class="rombo"><img src="Dustin.jpeg" alt="Imagen 3"></div>
        <div class="rombo"><img src="Dustin.jpeg" alt="Imagen 3"></div>
        <div class="rombo"></div>
      </div>

      <!-- Fila 4 -->
      <div class="fila fila4">
        <div class="rombo"><img src="Danna.jpeg" alt="Imagen 3"></div>
        <div class="rombo"><img src="Salamanca.jpeg" alt="Imagen 3"></div>
        <div class="rombo"><img src="karen.jpeg" alt="Imagen 3"></div>
      </div>

      <!-- Fila 5 -->
      <div class="fila fila5">
        <div class="rombo"><img src="Nicol.jpeg" alt="Imagen 3"></div>
        <div class="rombo"><img src="Sofia.jpeg" alt="Imagen 3"></div>
        <div class="rombo"><img src="Vera.jpeg" alt="Imagen 3"></div>
        <div class="rombo"></div>
      </div>
    </div>

    <!-- Escudo -->
    <div class="escudo">
      <img src="Bandera_UMNG.jpeg" alt="Escudo Universidad Militar Nueva Granada">
    </div>
  </div>

  <!-- Conexión al script -->
  <script src="script.js"></script>
</body>
</html>
